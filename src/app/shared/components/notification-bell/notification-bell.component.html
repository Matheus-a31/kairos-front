<button mat-icon-button [matMenuTriggerFor]="notificationMenu" (menuOpened)="onMenuOpened()" class="bell-btn" [matBadge]="notificationService.unreadCount() > 0 ? notificationService.unreadCount() : null" matBadgeColor="warn" matBadgeSize="small">
  <mat-icon>notifications</mat-icon>
</button>

<mat-menu #notificationMenu="matMenu" class="notification-menu">
  <div class="notification-header" (click)="$event.stopPropagation()">
    <h3>Notificações</h3>
    <button mat-button color="primary" class="mark-all-btn" (click)="markAllAsRead($event)" *ngIf="notificationService.unreadCount() > 0">
      Marcar todas como lidas
    </button>
  </div>

  <div class="notification-list" (click)="$event.stopPropagation()">
    <div *ngIf="notificationService.notifications().length === 0" class="empty-state">
      <mat-icon>notifications_none</mat-icon>
      <p>Nenhuma notificação por enquanto.</p>
    </div>

    <div *ngFor="let notification of notificationService.notifications()" 
         class="notification-item" 
         [class.unread]="!notification.isRead"
         (click)="onNotificationClick(notification, $event)">
         
      <div class="notification-icon">
        <mat-icon *ngIf="notification.type === 'PROJECT_INVITE'" class="invite-icon">group_add</mat-icon>
        <mat-icon *ngIf="notification.type === 'TASK_ASSIGNED'" class="task-icon">assignment_ind</mat-icon>
        <mat-icon *ngIf="notification.type === 'TASK_UPDATED'" class="update-icon">update</mat-icon>
        <mat-icon *ngIf="notification.type === 'GENERAL'" class="general-icon">info</mat-icon>
      </div>
      
      <div class="notification-content">
        <p class="message">{{ notification.message }}</p>
        <span class="time">{{ notification.createdAt | date:'short' }}</span>
      </div>
      
      <div class="unread-indicator" *ngIf="!notification.isRead"></div>
    </div>
  </div>
</mat-menu>
