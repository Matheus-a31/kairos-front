<h2 mat-dialog-title>{{ isEditMode ? 'Editar Projeto' : 'Novo Projeto' }}</h2>

<mat-dialog-content>
  <form [formGroup]="projectForm" class="project-form">
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nome do Projeto</mat-label>
      <input matInput formControlName="name" placeholder="Ex: Redesign do App">
      <mat-error *ngIf="projectForm.get('name')?.hasError('required')">Nome é obrigatório</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descrição</mat-label>
      <textarea matInput formControlName="description" rows="3" placeholder="O que vamos construir?"></textarea>
    </mat-form-field>

    <div class="dates-row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Data de Início</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="startDate">
        <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Previsão de Fim</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="endDate">
        <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width" *ngIf="isEditMode">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="PLANNING">Planejamento</mat-option>
        <mat-option value="IN_PROGRESS">Em Andamento</mat-option>
        <mat-option value="COMPLETED">Concluído</mat-option>
        <mat-option value="CANCELLED">Cancelado</mat-option>
      </mat-select>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="isLoading">Cancelar</button>
  <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="projectForm.invalid || isLoading">
    {{ isLoading ? 'Salvando...' : 'Salvar' }}
  </button>
</mat-dialog-actions>
