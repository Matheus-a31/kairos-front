<div class="auth-container flex-center">
  <mat-card class="auth-card card">
    
    <div class="auth-header">
      <h1 class="logo">Kairós</h1>
      <h2>Criar sua conta</h2>
      <p>Junte-se a nós para gerenciar seus projetos.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nome Completo</mat-label>
        <input matInput type="text" formControlName="name" placeholder="Seu nome">
        <mat-error *ngIf="registerForm.get('name')?.hasError('required')">Nome é obrigatório</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" placeholder="seu@email.com">
        <mat-error *ngIf="registerForm.get('email')?.hasError('required')">E-mail é obrigatório</mat-error>
        <mat-error *ngIf="registerForm.get('email')?.hasError('email')">Formato de e-mail inválido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="password" placeholder="Mínimo 6 caracteres">
        <mat-error *ngIf="registerForm.get('password')?.hasError('required')">Senha é obrigatória</mat-error>
        <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" class="full-width submit-btn" type="submit" [disabled]="registerForm.invalid || isLoading">
        <span *ngIf="!isLoading">Cadastrar</span>
        <mat-spinner *ngIf="isLoading" diameter="20" color="accent"></mat-spinner>
      </button>

    </form>

    <div class="auth-footer">
      <p>Já tem uma conta? <a routerLink="/auth/login">Fazer login</a></p>
    </div>

  </mat-card>
</div>
